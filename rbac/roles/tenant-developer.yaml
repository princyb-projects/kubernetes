# tenant-developer ClusterRole
# Grants permission to deploy and manage workloads within a tenant namespace.
# Intended for developers who need to deploy applications but not manage namespace-level policy.
# Applied via a namespace-scoped RoleBinding (not a ClusterRoleBinding) so permissions
# are confined to the bound namespace only.
#
# Security notes:
#   - pods/exec is excluded to prevent arbitrary command execution inside running containers.
#   - Secret access is read-only (get/list/watch). Developers can reference existing secrets
#     in workloads but cannot create, update, or delete them (managed by tenant-admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-developer
  labels:
    rbac-tier: tenant
rules:
  # Read and manage pods (no exec for security)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage apps workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage batch jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only access to ingress
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  # Read-only access to secrets (cannot create/delete)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  # Read resource quotas and limits
  - apiGroups: [""]
    resources:
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
